<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#101c33;color:#fff;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;align-items:center;justify-content:space-between;padding:64px 72px;overflow:hidden;position:relative}
  .glow{position:absolute;right:-140px;top:-150px;width:660px;height:660px;border-radius:50%;
        background:radial-gradient(circle at 42% 42%,rgba(227,198,117,.30),rgba(227,198,117,0) 62%)}
  .glow2{position:absolute;left:-160px;bottom:-180px;width:520px;height:520px;border-radius:50%;
        background:radial-gradient(circle at 50% 50%,rgba(227,198,117,.14),rgba(227,198,117,0) 64%)}
  .txt{position:relative;z-index:2;max-width:640px}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
  .brand span{font-size:28px;letter-spacing:.4px;font-weight:600}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:60px;line-height:1.07;letter-spacing:-1.3px;margin-bottom:20px}
  h1 em{color:#e3c675;font-style:normal}
  p{font-size:24px;line-height:1.5;color:#c3cbdb;max-width:590px}
  .pill{margin-top:32px;display:inline-flex;align-items:center;gap:12px;background:rgba(227,198,117,.12);
        border:1px solid rgba(227,198,117,.45);color:#f0d99c;padding:13px 26px;border-radius:999px;font-size:21px;letter-spacing:.3px}
  .art{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px}
  .orbit{position:absolute;width:404px;height:404px;border-radius:50%;border:1.5px dashed rgba(227,198,117,.35);top:6px}
  .ring{width:352px;height:352px;border-radius:50%;overflow:hidden;border:3px solid #e3c675;position:relative;
        box-shadow:0 0 0 16px rgba(227,198,117,.09),0 26px 60px rgba(0,0,0,.42)}
  .ring img{width:100%;height:100%;object-fit:cover;object-position:50% 16%}
  .name{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:32px;letter-spacing:.4px;margin-top:6px}
  .role{font-size:19px;color:#c3cbdb;margin-top:-8px}
</style></head><body>
  <div class="glow"></div><div class="glow2"></div>
  <div class="txt">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#1b2b4a"/><path d="M16 6c1.9 2.2 2.8 4.6 2.8 7.4 0 3-1 5.6-2.8 7.7-1.8-2.1-2.8-4.7-2.8-7.7C13.2 10.6 14.1 8.2 16 6z" fill="#e3c675"/><circle cx="16" cy="24.6" r="2.1" fill="#b98b1e"/></svg>
      <span>utsman.works</span>
    </div>
    <h1>Asisten AI untuk <em>pekerjaan sehari-hari</em></h1>
    <p>Mencatat, menyusun laporan, mengingatkan jadwal — untuk kantor, pribadi, dan organisasi.</p>
    <div class="pill">Segera hadir</div>
  </div>
  <div class="art">
    <div class="orbit"></div>
    <div class="ring"><img src="assets/utsman.jpg" alt=""></div>
    <div class="name">Utsman</div>
    <div class="role">Agen AI</div>
  </div>
</body></html>
