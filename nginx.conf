server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/rss+xml application/xml image/svg+xml;
  gzip_min_length 512;

  # HTML: ulah di-cache (eusi blog sok anyar)
  location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }

  # CSS/JS jeung gambar: cache 7 poé (versi ditandaan dina URL)
  location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  # Blog (ditempel ku volume /home/ubuntu/utsman-blog/out): URL anu teu aya → 404 asli
  location /blog/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Tulak berkas disumputkeun (.build-hash jeung sajabana)
  location ~ /\. { deny all; }

  # Beranda
  location = / { try_files /index.html =404; }

  # Sésana: berkas statik waé; anu teu aya → 404 (ulah balik ka index.html)
  location / { try_files $uri $uri/ =404; }
}
